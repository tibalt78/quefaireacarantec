*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--encre);background:var(--sable)}

aside{display:flex;flex-direction:column;min-height:0;min-width:0;background:#fff;border-right:1px solid var(--ligne);z-index:2}
header{padding:16px 18px 10px;background:var(--mer);color:#fff}
header .sur{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
header h1{font-family:Lora,Georgia,serif;font-size:24px;margin:2px 0 0;line-height:1.15}

.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;margin-bottom:8px}
.brand .q{width:40px;height:auto;flex:0 0 auto}
.brand .b1{display:block;font:700 10.5px/1.2 Poppins,sans-serif;letter-spacing:.3em;text-transform:uppercase}
.brand .b2{display:block;font:700 30px/1 Lora,Georgia,serif;margin:2px 0 3px}
.brand .b3{display:flex;align-items:center;gap:8px;font:700 10px/1.2 Poppins,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8fe0d2}
.brand .b3:before{content:"";width:20px;height:2px;background:currentColor}
header h1{font-size:19px;color:#F2C230}
.mob .q{width:18px;height:auto;vertical-align:-5px;margin-right:7px}
.retour{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;text-decoration:none}
.jours{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--mer2);scrollbar-width:thin}
.jour{flex:0 0 auto;border:0;border-radius:10px;padding:6px 9px;background:rgba(255,255,255,.12);color:#fff;font:inherit;cursor:pointer;text-align:center;min-width:52px}
.jour b{display:block;font-size:17px;line-height:1.1}
.jour small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.jour.on{background:#fff;color:var(--mer)}
.jour .pt{display:block;height:4px;margin:3px auto 0;width:4px;border-radius:2px;background:#ffd166}
.jour.on .pt{background:var(--ev)}
.filtres{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--ligne)}
.chip{border:1px solid var(--ligne);background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--encre)}
.chip[aria-pressed="true"]{background:var(--encre);color:#fff;border-color:var(--encre)}
.chip.petit{font-size:12px;padding:4px 9px;color:var(--gris)}
.chip.petit[aria-pressed="true"]{color:#fff}
.liste{overflow-y:auto;padding:4px 0 24px;flex:1;min-height:0}
.titreJour{font-family:Lora,Georgia,serif;font-size:19px;padding:12px 16px 2px;margin:0}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);padding:12px 16px 4px;font-weight:600}
.it{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 16px;cursor:pointer;border-left:3px solid transparent}
.it:hover{background:#faf7f0;border-left-color:var(--ev)}
.it .emo{font-size:20px;line-height:1.2;text-align:center}
.it .h{font-weight:600;color:var(--ev);font-size:13px}
.mob{text-decoration:none}
.jour .pt{background:#F2C230}
.it .t{font-weight:600;font-size:14.5px;line-height:1.3}
.it .l{color:var(--gris);font-size:12.5px;margin-top:1px}
.it .p{font-size:12.5px;margin-top:2px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px;text-transform:uppercase}
.b-complet{background:#fde2e1;color:#b42318}
.b-ouv{background:#dcfce7;color:#166534}
.b-fer{background:#eef0f3;color:#6b7380}
.vide{padding:10px 16px;color:var(--gris);font-size:13.5px}
.note{font-size:11.5px;color:var(--gris);padding:14px 16px 0;line-height:1.45}

.fonds button.on{background:var(--mer);color:#fff}

.leaflet-bar a{color:#2f6e5a!important}

.nom-lieu.terre{color:#4b6b55;font-size:12px}

main.nuit .nom-lieu{color:#9fe0d3;text-shadow:0 0 4px #0a1e27,0 0 4px #0a1e27}
main::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;box-shadow:inset 0 0 70px rgba(25,70,50,.28)}
main.nuit::after{box-shadow:inset 0 0 90px rgba(0,0,0,.55)}
.pin,.pt-lieu{filter:drop-shadow(0 3px 4px rgba(20,50,35,.35))}
.legende{position:absolute;left:12px;bottom:24px;z-index:500;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);line-height:1.7}

.lg-callot{border-top:4px solid #2f9e5b;border-radius:2px}

.cal b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#2f8a7d}
.cal .ok{color:#1f7a45;font-weight:600}.cal .ko{color:#b42318;font-weight:600}

.legende i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.approx{font-size:11px;color:var(--gris);font-style:italic;margin-top:4px}

  main{order:1;min-height:54vh}
  header{display:none}
  .legende{display:none}
  .app.plein aside{max-height:85dvh}

.mob{display:none}
@media (max-width:820px){.mob{display:flex;align-items:center;position:absolute;top:10px;left:56px;z-index:500;background:var(--mer);color:#fff;border-radius:10px;padding:7px 11px;font-family:Lora,Georgia,serif;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25)}}

   LOGIQUE
   ========================================================= */
const COUL = {ev:"#C8287A",bar:"#6d4bd1",resto:"#2f8a7d",pouce:"#D99A00"};
const EMO = {musique:"🎵",culture:"🎭",cine:"🎬",enfants:"🧸",fete:"🎉",sport:"⚽",nature:"🌿",telethon:"💛",marche:"🧺"};
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JLONG = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseIso = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const enVacances = s => VACANCES.some(([a,b])=>s>=a&&s<=b);
const minutes = h => {const m=String(h).match(/(\d{1,2})h(\d{2})?/);if(m)return +m[1]*60+(+m[2]||0);return /matin/i.test(h)?480:/journ/i.test(h)?481:/apéro/i.test(h)?1110:1500;};

function evenementsDu(s){
  const D=parseIso(s), w=D.getDay();
  const out=EV.filter(e=>e.d===s).map(e=>({...e}));
  for(const e of WEEKLY){
    if(e.w!==w) continue;
    if(e.sauf&&e.sauf.includes(s)) continue;
    if(e.jusqu&&s>e.jusqu) continue;
    if(e.vac&&enVacances(s)) continue;
    if(e.n===1){
      // 1er vendredi du mois ; « dec » = nombre de jours après ce vendredi
      const ref=new Date(D); ref.setDate(D.getDate()-(e.dec||0));
      if(ref.getDate()>7) continue;
      if(e.dec && ref.getDay()!==5) continue;
    }
    out.push({...e,d:s,hebdo:1});
  }
  return out.sort((a,b)=>minutes(a.h)-minutes(b.h));
}
function lieuDe(e){
  const txt=(e.l||"")+" "+(e.t||"");
  for(const v of VENUES){ if(v[0]===e.c && v[1].test(txt)) return {ll:[v[2],v[3]],nom:v[4],approx:!!v[5],cle:e.c+"|"+v[4]}; }
  const c=COMMUNES[e.c]||COMMUNES["Carantec"];
  return {ll:c,nom:e.l||e.c,approx:true,cle:e.c+"|centre",centre:true};
}
function horairesDu(p,s){
  const D=parseIso(s), j=JOURS[D.getDay()];
  if(p.ferme) return {ouvert:false,txt:p.ferme};
  if(p.tous) return {ouvert:true,txt:p.tous};
  if(p.h){
    if(p.vacOuvert && enVacances(s)) return {ouvert:true,txt:"Ouvert tous les jours pendant les vacances scolaires"};
    const t=p.h[j]; return {ouvert:t!=="fermé",txt:t==="fermé"?"Fermé ce jour":t};
  }
  if(p.golf){
    const g={lun:"Snack le midi",mar:"Snack le midi",mer:"Restaurant le midi (dès 12h30)",jeu:"Restaurant le midi (dès 12h30)",ven:"Restaurant le midi (dès 12h30)",sam:"Restaurant le midi (dès 12h30)",dim:"Brunch le matin (sur réservation)"};
    return {ouvert:true,txt:g[j]+" · snacking maison à toute heure"};
  }
  if(p.jours){
    if(p.exc && s>=p.exc.de && s<=p.exc.a) return {ouvert:false,txt:p.exc.txt};
    let code=p.jours.split(" ")[(D.getDay()+6)%7];
    let extra="";
    if(p.exc2 && s===p.exc2.d){code=p.exc2.jours;extra=" · "+p.exc2.txt;}
    const midi=code[0]==="1", soir=code[1]==="1";
    if(!midi&&!soir) return {ouvert:false,txt:"Fermé ce jour"};
    const parts=[]; if(midi)parts.push("midi"+(p.midi?" ("+p.midi+")":"")); if(soir)parts.push("soir"+(p.soir?" ("+p.soir+")":""));
    return {ouvert:true,txt:"Ouvert "+parts.join(" et ")+extra};
  }
  return {ouvert:true,txt:""};
}
function semaineHTML(p,s){
  if(!p.h) return "";
  const today=JOURS[parseIso(s).getDay()];
  const ordre=["lun","mar","mer","jeu","ven","sam","dim"];

function largeur(w,k){
  if(typeof w==="number") return w*k;
  if(Array.isArray(w)&&w[0]==="interpolate"){const o=w.slice(0,3);for(let i=3;i<w.length;i+=2)o.push(w[i],typeof w[i+1]==="number"?w[i+1]*k:["*",k,w[i+1]]);return o;}
  if(w&&w.stops) return {...w,stops:w.stops.map(([z,v])=>[z,v*k])};
  return w;
}
function styliser(style,t){
  const out=[];
  for(const l of style.layers){
    const p=l.paint=l.paint||{}, sl=l["source-layer"]||"", id=l.id;
    if(l.type==="background") p["background-color"]=t.bg;
    else if(l.type==="fill"){
      if(sl==="water"){p["fill-color"]=t.eau;}
      else if(id==="park") p["fill-color"]=t.parc;
      else if(id==="landcover_wood"){p["fill-color"]=t.bois;p["fill-opacity"]=.8;}
      else if(sl==="landuse") p["fill-color"]=t.resid;
      else if(sl==="building"){p["fill-color"]=t.bati;p["fill-outline-color"]=t.batiTrait;}
      else if(sl==="transportation") p["fill-color"]=t.route;
    }
    else if(l.type==="line"){
      if(p["line-width"]!==undefined) p["line-width"]=largeur(p["line-width"],t.k);
      if(sl==="transportation"){
        if(/rail/.test(id)) p["line-color"]=t.rail;
        else if(/casing/.test(id)) p["line-color"]=t.bord;
        else if(/path|pier/.test(id)){
          if(t.sentier){p["line-color"]=t.sentier;p["line-dasharray"]=[1,1.6];p["line-width"]=["interpolate",["linear"],["zoom"],12,.8,15,1.6,18,2.6];p["line-opacity"]=.9;}
          else {p["line-color"]=t.chemin;p["line-dasharray"]=[2,2];}
        }
        else if(/minor/.test(id)) p["line-color"]=t.mineure;
        else p["line-color"]=t.route;
      } else if(sl==="boundary"){p["line-color"]=t.limite;}
      else if(sl==="waterway"){p["line-color"]=t.eau;}
    }
    else if(l.type==="symbol"){
      p["text-color"]=/water/.test(id)?t.texteEau:t.texte; p["text-halo-color"]=t.halo; p["text-halo-width"]=1.4;
    }
    if(id==="building" && t.ombreBati){ // ombre portée des bâtiments
      out.push({id:"bati-ombre",type:"fill",source:"openmaptiles","source-layer":"building",minzoom:14,
        paint:{"fill-color":t.ombreBati,"fill-translate":[1.6,1.6],"fill-opacity":["interpolate",["linear"],["zoom"],14,0,15.5,.9]}});
    }
    if(l.type==="symbol" && /water/.test(id)) l.layout={...(l.layout||{}),"text-font":["Noto Sans Italic"],"text-letter-spacing":.15};
    out.push(l);
    if(id==="water" && t.vagues){ // lignes de rivage façon carte ancienne
      [[3,.55],[7,.35],[12,.2]].forEach(([o,op],i)=>out.push({id:"vague"+i,type:"line",source:"openmaptiles","source-layer":"water",minzoom:11,
        paint:{"line-color":"#4f9d8c","line-width":.7,"line-offset":["interpolate",["linear"],["zoom"],11,o*.4,16,o],"line-opacity":op}}));
    }
    if(id==="water"){ // ombre douce le long du littoral + trait de côte fin
      out.push({id:"cote-ombre",type:"line",source:"openmaptiles","source-layer":"water",
        paint:{"line-color":t.ombre,"line-opacity":t.ombreOp,"line-blur":["interpolate",["linear"],["zoom"],8,3,16,14],"line-width":["interpolate",["linear"],["zoom"],8,4,16,18]}});
      out.push({id:"cote-trait",type:"line",source:"openmaptiles","source-layer":"water",
        paint:{"line-color":t.cote,"line-width":["interpolate",["linear"],["zoom"],10,.4,17,1.1],"line-opacity":.9}});
    }
  }
  style.layers=out; return style;
}

}
function choisir(s){
  etat.jour=s;
  document.querySelectorAll(".jour").forEach(b=>{const on=b.dataset.j===s;b.classList.toggle("on",on);if(on)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});});
  dessiner();
}

/* ---------- Filtres et boutons ---------- */
document.querySelectorAll("#filtres .chip").forEach(b=>{
  b.setAttribute("aria-pressed",etat.f[b.dataset.f]?"true":"false");
  b.addEventListener("click",()=>{const f=b.dataset.f;etat.f[f]=!etat.f[f];b.setAttribute("aria-pressed",etat.f[f]?"true":"false");
    try{localStorage.setItem("carteCarantecFiltres",JSON.stringify(etat.f));}catch(e){} dessiner();});
});
document.getElementById("bCarantec").onclick=()=>map.flyTo(CARANTEC,16,{duration:.7});
document.getElementById("bEnvirons").onclick=()=>{
  const pts=[]; marqueursEv.forEach(m=>pts.push(m.getLatLng())); pts.push(L.latLng(CARANTEC));
  if(pts.length>1) map.flyToBounds(L.latLngBounds(pts).pad(0.12),{duration:.8,maxZoom:15});
  else map.flyTo(CARANTEC,12);
};

construireJours();
</script>
